version: 2

models:
  - name: stg_orders
    description: Cleaned orders with proper data types.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, processing, shipped, delivered, cancelled, refunded]
      - name: quantity
        data_tests: [not_null]